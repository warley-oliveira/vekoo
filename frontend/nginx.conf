# nginx do front em produção (atrás do kamal-proxy, que termina o TLS).
#
# Os cabeçalhos repetem os do public/_headers (Cloudflare). Cuidado com a
# herança do nginx: um `add_header` dentro de `location` DESCARTA todos os do
# nível de cima — por isso o bloco de segurança vem de um include em cada um.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Healthcheck do kamal-proxy.
  location = /up {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Arquivos com hash no nome — imutáveis por definição.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Fallback do SPA (BrowserRouter): /login e /brands/:id não têm arquivo no
  # disco. O HTML nunca é cacheado, senão um deploy novo continua servindo o
  # index.html velho, que aponta para bundles que não existem mais.
  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
