<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      `viewport-fit=cover` deixa a página desenhar sob as barras do sistema: é o que faz
      `env(safe-area-inset-*)` valer, e o que evita a faixa preta da barra de navegação
      no PWA instalado no Android. Sem `maximum-scale`: o zoom de pinça fica disponível,
      e os campos têm 16 px no celular, o que já impede o zoom automático do iOS.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Atendimento, automação e carrosséis para Instagram, tudo em um lugar só."
    />
    <!--
      A cor do fundo: a barra de status se confunde com o cabeçalho. O valor aqui é o do claro;
      `theme-init.js`, logo abaixo, troca pelo do tema da pessoa antes de pintar.
    -->
    <meta name="theme-color" content="#fefdfd" />
    <meta name="color-scheme" content="light dark" />
    <!-- Bloqueante de propósito, e minúsculo: sem ele, quem usa o escuro veria o claro piscar. -->
    <script src="/theme-init.js"></script>

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vekoo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Vekoo" />

    <title>Vekoo — Carrosséis prontos para o seu Instagram</title>
  </head>
  <body>
    <noscript>O Vekoo precisa de JavaScript para funcionar.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
