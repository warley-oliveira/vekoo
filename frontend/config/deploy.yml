# Kamal 2 — front Vekoo em app.107-152-37-59.sslip.io
#
# Mesmo host e mesmo kamal-proxy da API (backend/config/deploy.yml): o proxy
# roteia pelo hostname. O SPA é estático — nginx servindo o build do Vite.

minimum_version: 2.12.0
service: vekoo-web

image: vekoo-web

servers:
  web:
    hosts:
      - 107.152.37.59

proxy:
  ssl: true                         # Let's Encrypt pelo kamal-proxy
  host: app.107-152-37-59.sslip.io
  app_port: 80
  healthcheck:
    path: /up

# Registry local do Kamal: a imagem sobe por túnel SSH, sem GHCR nem token.
registry:
  server: localhost:5555

builder:
  arch: amd64
  args:
    # Inlinada no bundle em build time — trocar exige `kamal deploy` de novo.
    VITE_API_URL: https://api.107-152-37-59.sslip.io

ssh:
  user: deploy
  keys:
    - "~/.ssh/vekoo_deploy"

retain_containers: 3
