# As marcas do teste lado a lado da Fase 3 (`bin/rails references:eval:brands`).
# Fictícias, com conteúdo brasileiro de verdade. Ficam numa organização só
# delas, no dev — nunca em produção.
#
# Quatro nos nichos que o banco tem e duas fora (pet e contabilidade), para
# medir se o padrão atravessa de ramo. Cada uma nasce publicada, com nicho e
# estilo, e com 5 fotos fixas — geradas uma vez e guardadas como foto enviada
# pela marca: no teste a ferramenta de foto fica desligada nos dois lados, e a
# foto não decide a disputa.
#
# A chave (`padaria`, `burger`…) é a mesma dos pedidos na página do teste.

padaria:
  identity:
    name: Padaria Fermento Lento
    segment: Padaria de fermentação natural
    concept: Pão de fermentação natural com 48 horas de descanso, assado todo dia às 5 da manhã no forno de lastro.
    positioning: A padaria de bairro que trata o pão como ofício, sem pressa e sem atalho.
    niche: food_beverage
    archetypes: { primary: natural_artisanal, secondary: traditional_heritage }
  palette:
    - { name: Casca, hex: "#3b2a1a", role: darkBackground }
    - { name: Miolo, hex: "#f6efe3", role: textOnDark }
    - { name: Farinha, hex: "#fbf8f2", role: lightBackground }
    - { name: Café, hex: "#2a1d12", role: textOnLight }
    - { name: Mel, hex: "#d9902f", role: accent }
  typography:
    display: Fraunces
    utility: Work Sans
  voice:
    essence: Fala como quem assa — devagar, com detalhe e sem enfeite.
    tones: [warm, direct]
  offers:
    - { name: Pão de fermentação natural, price: R$ 22, description: Massa de 48 horas, casca grossa e miolo aberto., validity: Todo dia a partir das 7h }
    - { name: Combo café com pão na chapa, price: R$ 12, description: Café coado e pão na chapa com manteiga., validity: Segunda a sexta, até as 10h }
    - { name: Panetone de fermentação natural, price: R$ 89, description: Frutas maceradas no rum e 72 horas de fermentação., validity: Encomendas até 15 de dezembro }
  notes: "Rua das Laranjeiras, 214. Seg–Sáb 6h–19h. Dom 7h–13h."
  photos:
    - Pão de fermentação natural recém-saído do forno sobre bancada de madeira, casca dourada e rachada, luz lateral de janela, fundo escuro desfocado.
    - Mãos enfarinhadas moldando massa sobre mesa de madeira, close, luz quente da manhã, sem rosto.
    - Interior de padaria de bairro com prateleiras de pães e balcão de madeira, luz natural, sem pessoas.
    - Xícara de café coado e pão na chapa com manteiga derretendo sobre mesa de mármore, vista de cima, espaço livre na metade de cima.
    - Forno de lastro aberto com pães assando, brasa ao fundo, tons quentes, madrugada.

