# English copy for the API. Keep the same keys as pt-BR.yml (the source locale).
en:
  errors:
    not_found: "Not found."
    unauthorized: "You need to sign in to continue."
    unprocessable: "We couldn't save that. Check the fields."
    parameter_missing: "Missing %{param}."
    format: "%{attribute} %{message}"
    messages:
      blank: "can't be blank"
      taken: "is already taken"
      invalid: "doesn't look valid"
      inclusion: "is not on the list"
      incomplete: "is incomplete"
      confirmation: "doesn't match the confirmation"
      too_short: "is too short (minimum is %{count} characters)"
      too_long: "is too long (maximum is %{count} characters)"
      not_a_number: "is not a number"
      greater_than_or_equal_to: "must be greater than or equal to %{count}"
      less_than_or_equal_to: "must be less than or equal to %{count}"

  auth:
    email_not_found: "We couldn't find an account with that email."
    wrong_password: "Wrong password. Try again."
    email_taken: "That email already has a Vekoo account."
    reset_token_invalid: "This password link has expired or was already used."

  credits:
    no_credits: "You're out of credits."

  carousels:
    copy_suffix: "copy"

  activerecord:
    models:
      account: "account"
      carousel: "carousel"
      folder: "folder"
      organization: "organization"
    attributes:
      account:
        name: "name"
        email: "email"
        password: "password"
        role: "role"
      organization:
        name: "account name"
        plan: "plan"
        credits_total: "credit total"
        credits_used: "credits used"
      carousel:
        title: "title"
        format: "format"
        theme: "theme"
        cards: "cards"
      folder:
        name: "name"
        color: "color"
