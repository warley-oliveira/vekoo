# Textos da agenda em pt-BR (idioma padrão). Mantenha as mesmas chaves de agenda.en.yml.
pt-BR:
  # Datas por extenso, em lembretes e avisos. O projeto não usa a gem rails-i18n.
  date:
    formats:
      default: "%d/%m/%Y"
      long: "%d de %B de %Y"
      short: "%d de %b"
    day_names: [domingo, segunda-feira, terça-feira, quarta-feira, quinta-feira, sexta-feira, sábado]
    abbr_day_names: [dom, seg, ter, qua, qui, sex, sáb]
    month_names: [~, janeiro, fevereiro, março, abril, maio, junho, julho, agosto, setembro, outubro, novembro, dezembro]
    abbr_month_names: [~, jan, fev, mar, abr, mai, jun, jul, ago, set, out, nov, dez]
  time:
    formats:
      default: "%d/%m/%Y %H:%M"
      long: "%d de %B de %Y, %H:%M"
      short: "%d/%m, %H:%M"
    am: ""
    pm: ""

  mongoid:
    attributes:
      agenda/calendar:
        name: "Nome"
        time_zone: "Fuso horário"
        calendar_type: "Tipo"
        rebalancing_period: "Período de balanceamento"
        scheduling_notification_config: "Lembretes ao contato"
        professional_notifications_settings: "Lembretes ao profissional"
        professional_event_notifications: "Avisos ao profissional"
        attendance_sequences: "Sequências"
      agenda/professional:
        name: "Nome"
        account_id: "Conta"
        calendar: "Calendário"
      agenda/rule:
        days: "Horários"
        blocked_times: "Bloqueios"
        professional: "Profissional"
      agenda/offering:
        name: "Nome"
        duration: "Duração"
        time_increment_interval: "Intervalo entre horários"
        buffer_before: "Folga antes"
        buffer_after: "Folga depois"
        guest_limit: "Limite de pessoas"
        distribution: "Distribuição"
        calendar: "Calendário"
      agenda/booking:
        calendar: "Calendário"
        calendar_id: "Calendário"
        professional_id: "Profissional"
        service_id: "Serviço"
        chat_id: "Conversa"
        start: "Início"
        end: "Fim"
        status: "Situação"
        attendance_status: "Comparecimento"
      agenda/class_group:
