        visibility: "Visibility"
        definition: "Filter"
      pipelines/trigger:
        name: "Name"
        event_type: "Event"
        actions: "Actions"
        stage_id: "Stage"
    errors:
      # What's missing from the general messages in pt-BR.yml and the models here use.
      messages:
        greater_than: "must be greater than %{count}"
        less_than: "must be less than %{count}"
        not_an_integer: "must be an integer"
        in: "must be in %{count}"
        present: "must be blank"
        required: "must exist"
      models:
        pipelines/board:
          attributes:
            card_visibility_bypass_role_ids:
              blank_roles: "needs at least one permission group"
              invalid_roles: "has an invalid permission group"
        pipelines/card:
          attributes:
            tags:
              too_many: "can be at most %{count}"
              too_long: "can have at most %{count} characters each"
            custom_field_values:
              too_large: "are too large"
            description_json:
              too_large: "is too large"
        pipelines/card_attachment:
          attributes:
            file:
              too_large: "is over the %{count} MB limit"
        pipelines/comment_attachment:
          attributes:
            file:
              too_large: "is over the %{count} MB limit"
        pipelines/comment:
          attributes:
            base:
              no_author: "The comment needs an author"
              two_authors: "The comment can't have two authors"
        pipelines/saved_filter_favorite:
          attributes:
            base:
              no_target: "Choose a filter to favorite"
              two_targets: "Choose a single filter to favorite"
        pipelines/trigger:
          attributes:
            actions:
              too_many: "can be at most %{count}"
              not_an_object: "has an invalid item at position %{index}"
              invalid_type: "has an unknown type at position %{index}"
              code_blank: "has no code at position %{index}"
              code_too_long: "has code over %{count} characters at position %{index}"
            event_type:
              crm_only: "only applies to deal boards"
