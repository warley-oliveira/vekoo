# Textos do backend em pt-BR (idioma padrão). Mantenha as mesmas chaves de en.yml.
#
# São mensagens de API: acompanham sempre um `code` estável, que é o que a tela
# usa para decidir. A frase existe para o caso de a tela não conhecer o código.
pt-BR:
  errors:
    not_found: "Não encontrado."
    unauthorized: "Você precisa entrar para continuar."
    too_many_requests: "Tentativas demais. Espere alguns minutos e tente de novo."
    unprocessable: "Não foi possível salvar. Confira os campos."
    brand_required: "Todo carrossel nasce dentro de uma marca. Escolha a marca antes de criar."
    parameter_missing: "Faltou informar %{param}."
    # Mensagens de validação do Active Record (o produto não usa o rails-i18n).
    format: "%{attribute} %{message}"
    messages:
      blank: "não pode ficar em branco"
      taken: "já está em uso"
      invalid: "não parece válido"
      inclusion: "não está na lista"
      incomplete: "está incompleto"
      too_large: "é grande demais"
      confirmation: "não bate com a confirmação"
      too_short: "é curto demais (mínimo de %{count} caracteres)"
      too_long: "é longo demais (máximo de %{count} caracteres)"
      not_a_number: "não é um número"
      greater_than_or_equal_to: "deve ser maior ou igual a %{count}"
      too_many_lines: "tem linhas demais"
      line_too_long: "tem uma linha longa demais"
      too_many_items: "tem itens demais"
      too_small: "é pequeno demais"
      less_than_or_equal_to: "deve ser menor ou igual a %{count}"

  auth:
    email_not_found: "Não encontramos uma conta com esse e-mail."
    wrong_password: "Senha incorreta. Tente de novo."
    email_taken: "Esse e-mail já tem conta no Vekoo."
    reset_token_invalid: "Esse link de nova senha venceu ou já foi usado."

  ai:
    failed: "A geração falhou. Tente de novo."
    busy: "Já há uma geração em andamento. Espere ela terminar."

  onboarding:
    unknown_step: "Essa pergunta não existe."
    unknown_kind: "Não sei propor isso."
    cannot_finish: "Ainda falta responder o mínimo: nome, o que você faz, cores e fontes."
    logo_required: "Envie a logo ou peça um logotipo para a Vekoo."
    wordmark_failed: "Não deu para desenhar o logotipo. Você pode enviar um arquivo."

  agent:
    untitled: "Pedido sem título"
    busy: "Ainda estou preparando o pedido anterior. Só um instante."
    attachment_unknown: "Essa foto não está no acervo da marca."
    cost_cap: "A criação por conversa está indisponível agora. Tente mais tarde."

  credits:
    no_credits: "Seus créditos acabaram."

  uploads:
    too_large: "A imagem passa do tamanho máximo de %{max}."
    unsupported_type: "Esse arquivo não é uma imagem JPEG, PNG ou WebP."

  carousels:
    copy_suffix: "cópia"

  brand_core:
    invalid: "Alguma coisa nesta etapa não confere. Confira os campos."
    incomplete: "Falta preencher o mínimo da marca para publicar."
    # Nomes dos papéis de cor, para as cores derivadas terem nome sem obrigar
    # a pessoa a batizar seis cores que ela não escolheu uma a uma.
    roles:
      dark_background: "Fundo escuro"
      light_background: "Fundo claro"
      text_on_dark: "Texto no escuro"
      text_on_light: "Texto no claro"
      muted: "Apoio"
      accent: "Destaque"
      campaign: "Campanha"
    tones:
      direct: "direto"
      warm: "acolhedor"
      playful: "divertido"
      technical: "técnico"
      inspiring: "inspirador"
      sober: "sóbrio"
      bold: "ousado"
      educational: "didático"
    assets:
      bad_kind: "Esse tipo de ativo não existe."
      too_large: "O arquivo passa do tamanho máximo de %{max}."
      unsupported_logo: "O logo precisa ser um PNG com fundo transparente ou um SVG."
      unsupported_glyph: "O glifo precisa ser um PNG com fundo transparente ou um SVG."
      unsupported_photo: "Esse arquivo não é uma imagem JPEG, PNG ou WebP."
      unsupported_font: "Esse arquivo não é uma fonte TTF, OTF ou WOFF2."

  pieces:
    errors:
      values_invalid: "Alguma coisa nos campos da peça não confere."
      brand_not_published: "Publique a marca antes de gerar peças."
      engine_unknown: "Esse tipo de peça não existe."
      format_unsupported: "Esse tipo de peça não sai nesse formato."
      render_failed: "A geração falhou. Tente de novo."

  activerecord:
    errors:
      models:
        account:
          attributes:
            # "senha" é feminino — a mensagem genérica sairia "curto demais".
            password:
              too_short: "é curta demais (mínimo de %{count} caracteres)"
    models:
      account: "conta"
      carousel: "carrossel"
      folder: "pasta"
      organization: "organização"
      brand_core: "marca"
      brand_asset: "ativo da marca"
      brand_core_version: "versão da marca"
      piece: "peça"
    attributes:
      account:
        name: "nome"
        email: "e-mail"
        password: "senha"
        role: "papel"
      organization:
        # "Nome da conta" é como a tela de cadastro chama a organização.
        name: "nome da conta"
        plan: "plano"
        credits_total: "total de créditos"
        credits_used: "créditos usados"
      carousel:
        title: "título"
        format: "formato"
        theme: "tema"
        cards: "cards"
      folder:
        name: "nome"
        color: "cor"
      brand_core:
        status: "situação"
        document: "documento"
      brand_asset:
        kind: "tipo"
        variant: "versão"
        filename: "arquivo"
        content_type: "formato"
        byte_size: "tamanho"
      piece:
        title: "título"
        engine_id: "tipo de peça"
        format: "formato"
        status: "situação"
