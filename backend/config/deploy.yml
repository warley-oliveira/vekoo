# Kamal 2 — API Vekoo em syco.vekoo.app (e api.107-152-37-59.sslip.io)
#
# syco.vekoo.app é proxied na Cloudflare; o hostname sslip.io (que resolve para o
# IP embutido nele) é o acesso direto à origem. Os dois têm certificado do Let's
# Encrypt emitido pelo kamal-proxy (HTTP-01). O host foi provisionado com
# `bin/deploy-setup <chave> open` — 80/443 abertos ao mundo, não só às faixas da
# Cloudflare. O front fica no Cloudflare (wrangler), fora deste host. Ver DEPLOY.md.

minimum_version: 2.12.0
service: vekoo-api

image: vekoo-api

servers:
  web:
    hosts:
      - 107.152.37.59
  worker:
    hosts:
      - 107.152.37.59
    cmd: bundle exec sidekiq -C config/sidekiq.yml
    proxy: false                    # worker não recebe tráfego HTTP
    env:
      clear:
        # Tem que ser >= :concurrency do config/sidekiq.yml (5), senão o pool do
        # Active Record estoura com ConnectionTimeoutError intermitente.
        RAILS_MAX_THREADS: 6
        WEB_CONCURRENCY: 0

proxy:
  # Let's Encrypt pelo kamal-proxy, inclusive para syco (proxied na Cloudflare):
  # o desafio HTTP-01 atravessa a Cloudflare porque *Always Use HTTPS* está
  # desligado na zona. Ligar essa opção quebra a renovação do certificado.
  ssl: true
  hosts:
    - syco.vekoo.app
    - api.107-152-37-59.sslip.io    # acesso direto, sem a Cloudflare
  app_port: 80
  healthcheck:
    path: /up
    interval: 3
    timeout: 60                     # boot do Rails + db:prepare numa VPS pequena
  # O agente pensa por vários segundos; o teto precisa caber no turno inteiro.
  response_timeout: 300
  buffering:
    requests: true
    max_request_body: 52_428_800    # 50 MB — upload de logo, foto e fonte
    max_response_body: 0

# Registry local do Kamal: a imagem sobe por túnel SSH, sem GHCR nem token.
registry:
  server: localhost:5555

builder:
  arch: amd64

ssh:
  user: deploy
  # Explícito: o Kamal conecta pelo IP, não herda IdentityFile do ~/.ssh/config.
  keys:
    - "~/.ssh/vekoo_deploy"

env:
  clear:
    RAILS_ENV: production
    RAILS_MAX_THREADS: 5
    WEB_CONCURRENCY: 2
    APP_HOSTS: syco.vekoo.app,api.107-152-37-59.sslip.io      # config.hosts
    FRONTEND_ORIGINS: https://my.vekoo.app,https://vekoo.vekoo.workers.dev  # CORS, sem curinga
    BACKEND_URL: https://syco.vekoo.app                       # mailer/url_options
    # Renderizador "navegador" das peças: o Chromium da imagem abre a rota
    # /render do front publicado. Sem estas duas, o React falha limpo e o
    # libvips (o padrão) continua desenhando.
    FRONTEND_URL: https://my.vekoo.app
    CHROME_PATH: /usr/bin/chromium
    PIECE_RENDERER: libvips
    API_ORIGIN: https://syco.vekoo.app                        # URL absoluta dos blobs
    REDIS_URL: redis://vekoo-api-redis:6379/0                 # fila do Sidekiq
    CABLE_REDIS_URL: redis://vekoo-api-redis:6379/1           # pub/sub do ActionCable
    CACHE_REDIS_URL: redis://vekoo-api-redis:6379/2           # Rails.cache
    AGENT_MODEL: claude-sonnet-5-5
    AGENT_MONTHLY_COST_CENTS_CAP: 50000
  secret:
    - RAILS_MASTER_KEY
    - SECRET_KEY_BASE
    - DATABASE_URL
    - ANTHROPIC_API_KEY
    - SIGNUP_ALLOWLIST    # e-mails que podem criar conta; vazio = cadastro fechado

# Volume NOMEADO: nasce com dono 1000:1000 (o da imagem), então o container
# não-root consegue escrever. Um bind mount nasceria root:root e o primeiro
# upload morreria com EACCES. Sem ele, todo deploy apagaria os anexos.
volumes:
  - "vekoo_storage:/rails/storage"

accessories:
  db:
    # Postgres 16 + pgvector (embedding do banco de referências), fixado na
    # tag e no digest: major novo recusa PGDATA existente, e o Debian tem que
    # ser o da imagem anterior — trixie, glibc 2.41, conferido no servidor em
    # 2026-10-27 — para a collation não mudar. O digest é o da imagem testada
    # no dev. Só vale depois de `kamal accessory reboot db` (DEPLOY.md §2).
    image: pgvector/pgvector:0.8.7-pg16-trixie@sha256:40d828eda66737aaacb934387a337babf1455ebd56e9bdd13fc08e211257c972
    host: 107.152.37.59
    # SEM `port:` — publicar porta de container escreve direto na chain DOCKER-USER
    # do iptables e IGNORA o ufw, expondo o Postgres à internet.
    env:
      clear:
        POSTGRES_USER: vekoo
        POSTGRES_DB: vekoo_production
        PGDATA: /var/lib/postgresql/data/pgdata   # subdiretório: evita "lost+found"
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - "vekoo_pgdata:/var/lib/postgresql/data"
    options:
      health-cmd: "pg_isready -U vekoo -d vekoo_production"
      health-interval: 10s
      health-retries: 5

  redis:
    image: redis:7.4-alpine
    host: 107.152.37.59
    # O redis-server default NÃO persiste — um reboot descartaria a fila inteira.
    # noeviction para a fila nunca ser despejada por pressão de memória.
    cmd: "redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction"
    volumes:
      - "vekoo_redis:/data"
    options:
      health-cmd: "redis-cli ping"
      health-interval: 10s
      health-retries: 5

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell:   app exec --interactive --reuse "bash"
  migrate: app exec --reuse "bin/rails db:migrate"
  seed:    app exec --reuse "bin/rails db:seed"
  dbc:     accessory exec db --interactive --reuse "psql -U vekoo -d vekoo_production"

retain_containers: 3
deploy_timeout: 120
drain_timeout: 30
readiness_delay: 7
