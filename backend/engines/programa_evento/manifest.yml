# Programação de evento: horário + acontecimento, com crédito de parceiro.
id: programa_evento
name: { pt-BR: "Programa de evento", en: "Event program" }
description:
  pt-BR: "Título e a programação em linhas de horário e acontecimento, com um crédito discreto de parceiro no pé."
  en: "Title and the schedule as time + happening rows, with a discreet partner credit at the bottom."
formats: [post, story]
fields:
  - id: title
    type: text
    required: true
    label: { pt-BR: "Título", en: "Title" }
    constraints: { maxLines: 2, maxCharsPerLine: 24 }
  - id: schedule
    type: textList
    required: true
    label: { pt-BR: "Programação", en: "Schedule" }
    hint: { pt-BR: "Uma linha por horário: 19h | Abertura com a Marina", en: "One row per slot: 7pm | Opening with Marina" }
    constraints: { maxItems: 8, maxChars: 70 }
  - id: partner
    type: text
    required: false
    label: { pt-BR: "Crédito de parceiro", en: "Partner credit" }
    hint: { pt-BR: "Ex.: Apoio: Café da Praça", en: "E.g. Supported by Praça Café" }
    constraints: { maxLines: 1, maxChars: 40 }
  - id: background
    type: choice
    required: false
    label: { pt-BR: "Fundo", en: "Background" }
    source: palette.backgrounds
