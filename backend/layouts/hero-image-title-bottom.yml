id: hero-image-title-bottom
name: { pt-BR: "Imagem cheia, título embaixo", en: "Full image, title at the bottom" }
description:
  pt-BR: "Uma foto ocupando a peça inteira, com escurecimento e o título (e um corpo curto) na parte de baixo. Para quando a foto conta a história."
  en: "A photo filling the piece, with a scrim and the title (plus short body) at the bottom. When the photo tells the story."
formats: [feed_square, feed_portrait, story, carousel]
background_options: [color]
background_default: { type: color, color_token: primary }
align_options: [left, center]
slots:
  image: { type: image, required: true }
  title: { type: text, role_default: display, max_chars: 60, max_lines: 3, required: true }
  body:  { type: text, role_default: body, max_chars: 140, max_lines: 3 }
  badge: { type: text, role_default: label, max_chars: 24 }
  logo:  { type: logo, default_visible: true }

geometry:
  default:
    - { kind: fill, box: full }
    - { kind: image, slot: image, box: full }
    - { kind: scrim, box: { left: 0, right: 0, bottom: 0, height: "68%" }, from: bottom, opacity: 0.62 }
    - { kind: logo, slot: logo, box: { left: 80, top: 80 }, height: 64 }
    - kind: stack
      box: { left: 80, right: 80, bottom: 96 }
      anchor: bottom
      gap: 24
      ink: image
      items: [ { slot: badge, size: 30 }, { slot: title, size: 84 }, { slot: body, size: 38 } ]
  story:
    - { kind: fill, box: full }
    - { kind: image, slot: image, box: full }
    - { kind: scrim, box: { left: 0, right: 0, bottom: 0, height: "62%" }, from: bottom, opacity: 0.62 }
    - { kind: logo, slot: logo, box: { left: 80, top: 230 }, height: 64 }
    - kind: stack
      box: { left: 80, right: 80, bottom: 320 }
      anchor: bottom
      gap: 28
      ink: image
      items: [ { slot: badge, size: 32 }, { slot: title, size: 92 }, { slot: body, size: 40 } ]
