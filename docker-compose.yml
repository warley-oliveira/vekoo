# Dev infrastructure only: Postgres + Redis.
# The Rails app and Vite run natively on WSL2 (not containerized) for fast HMR/boot.
# Values come from ./.env; COMPOSE_PROJECT_NAME namespaces network/volumes per project.

services:
  postgres:
    # Postgres 16 com pgvector (o embedding do banco de referências). Mesma
    # major e mesmo Debian (trixie) da imagem oficial: o volume existente sobe
    # sem conversão e a collation da glibc não muda.
    image: pgvector/pgvector:0.8.7-pg16-trixie@sha256:40d828eda66737aaacb934387a337babf1455ebd56e9bdd13fc08e211257c972
    container_name: ${COMPOSE_PROJECT_NAME}_postgres
    restart: unless-stopped
    # Só na máquina: sem o 127.0.0.1, o Docker publica em todas as interfaces.
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: ${COMPOSE_PROJECT_NAME}_redis
    restart: unless-stopped
    # Só na máquina, como o Postgres: o Redis de dev não tem senha.
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
